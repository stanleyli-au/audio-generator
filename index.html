<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio EE - Signal Generator & Analyzer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Audio Signal Generator & Analyzer</h1>
        </header>

        <main>
            <section id="controls" class="glass-panel">
                <h2>Signal Generator</h2>
                <div class="control-group">
                    <label for="waveform-select">Waveform</label>
                    <select id="waveform-select">
                        <option value="sine">Sine</option>
                        <option value="square">Square</option>
                        <option value="triangle">Triangle</option>
                        <option value="sawtooth">Sawtooth</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="frequency-slider">Frequency (Hz)</label>
                    <div class="input-row">
                        <input type="range" id="frequency-slider" min="20" max="20000" value="440" step="1">
                        <input type="number" id="frequency-input" min="20" max="20000" value="440">
                    </div>
                </div>

                <div class="control-group">
                    <label for="volume-slider">Volume</label>
                    <input type="range" id="volume-slider" min="0" max="1" value="0.5" step="0.01">
                </div>

                <div class="control-group">
                    <label>Frequency Presets (Hz)</label>
                    <div class="preset-buttons">
                        <button class="freq-preset" data-value="20">20</button>
                        <button class="freq-preset" data-value="400">400</button>
                        <button class="freq-preset" data-value="1000">1k</button>
                        <button class="freq-preset" data-value="2000">2k</button>
                        <button class="freq-preset" data-value="4000">4k</button>
                        <button class="freq-preset" data-value="18000">18k</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Volume Presets (dB)</label>
                    <div class="preset-buttons">
                        <button class="vol-preset" data-value="0">0</button>
                        <button class="vol-preset" data-value="-3">-3</button>
                        <button class="vol-preset" data-value="-9">-9</button>
                        <button class="vol-preset" data-value="-30">-30</button>
                        <button class="vol-preset" data-value="-60">-60</button>
                        <button class="vol-preset" data-value="-90">-90</button>
                        <button class="vol-preset" data-value="silence">Silence</button>
                    </div>
                </div>

                <div class="control-group buttons">
                    <button id="play-btn" class="btn-primary">Play</button>
                    <button id="mute-btn" class="btn-secondary">Mute</button>
                </div>
            </section>

            <section id="visualizer" class="glass-panel">
                <h2>Real-time Analysis</h2>
                <div class="canvas-container">
                    <div class="canvas-wrapper">
                        <h3>Oscilloscope (Time Domain)</h3>
                        <canvas id="oscilloscope-canvas"></canvas>
                    </div>
                    <div class="canvas-wrapper">
                        <h3>Spectrum Analyzer (Frequency Domain)</h3>
                        <canvas id="spectrum-canvas"></canvas>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <p>Precision tools for Audio Engineers<br>Author: Stanley</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
